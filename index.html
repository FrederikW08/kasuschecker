<!DOCTYPE html>
<html lang="da">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasus Ordbog</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>Kasus Ordbog</h1>
<p class="subtitle">
Indtast et ord eller en sætning (tysk, latin eller dansk)
</p>

<div class="input-box">
    <input id="text" placeholder="Fx: Der Hund beißt den Mann">
    <button onclick="analyze()">Analyser</button>
</div>

<div id="result"></div>

</div>

<script>

async function analyze(){
    const text = document.getElementById("text").value;

    if(!text) return;

    const resultDiv = document.getElementById("result");
    resultDiv.innerHTML = "Analyserer...";

    try{
        const res = await fetch("http://127.0.0.1:5000/analyze", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({text})
        });

        const data = await res.json();

        if(!data.analysis){
            resultDiv.innerHTML = "Kunne ikke analysere teksten.";
            return;
        }

        let html = `<div class="language">Sprog: ${data.language}</div>`;

        html += `<div class="words">`;

        data.analysis.forEach(w => {
            let kasus = w.features || w.case || "—";

            html += `
            <div class="word">
                <div class="word-text">${w.word}</div>
                <div class="word-case">${kasus}</div>
            </div>
            `;
        });

        html += `</div>`;

        resultDiv.innerHTML = html;

    }catch(err){
        resultDiv.innerHTML = "Fejl ved forbindelse til server.";
    }
}

</script>

</body>
</html>
